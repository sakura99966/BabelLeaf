name: BabelLeaf PR checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      RUSTFLAGS: '-C target-cpu=skylake'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: detect src-tauri changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            tauri:
              - '.github/workflows/pull-request.yml'
              - '.gitmodules'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/readest-app/src-tauri/**'
              - 'packages/swift-rs/**'
              - 'packages/tao'
              - 'packages/tao/**'
              - 'packages/tauri'
              - 'packages/tauri/**'
              - 'packages/tauri-plugin-fs/**'

      - name: setup sccache
        if: steps.changes.outputs.tauri == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: install Rust toolchain
        if: steps.changes.outputs.tauri == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: cache apt packages
        if: steps.changes.outputs.tauri == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-rust-lint-${{ runner.os }}

      - name: install system dependencies
        if: steps.changes.outputs.tauri == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: check Rust formatting
        if: steps.changes.outputs.tauri == 'true'
        working-directory: apps/readest-app/src-tauri
        run: cargo fmt --check

      - name: run Clippy
        if: steps.changes.outputs.tauri == 'true'
        working-directory: apps/readest-app/src-tauri
        run: cargo clippy -p Readest --no-deps -- -D warnings

      - name: run Rust unit tests
        if: steps.changes.outputs.tauri == 'true'
        working-directory: apps/readest-app/src-tauri
        run: cargo test -p Readest --lib

  check_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: verify package manager version
        run: pnpm -w verify:package-manager

      - name: install dependencies
        working-directory: apps/readest-app
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm setup-vendors

      - name: check formatting
        run: pnpm format:check

      - name: lint application
        working-directory: apps/readest-app
        run: pnpm lint

      - name: build Tauri frontend
        working-directory: apps/readest-app
        run: pnpm build

      - name: check generated output contracts
        working-directory: apps/readest-app
        run: pnpm check:all

  test_app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: verify package manager version
        run: pnpm -w verify:package-manager

      - name: install dependencies
        working-directory: apps/readest-app
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm setup-vendors

      - name: cache Playwright browsers
        if: matrix.shard == 1
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: install Playwright Chromium
        if: matrix.shard == 1
        working-directory: apps/readest-app
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: run application unit tests
        working-directory: apps/readest-app
        run: pnpm test -- --run --maxWorkers=4 --shard=${{ matrix.shard }}/2

      - name: run browser-backed application tests
        if: matrix.shard == 1
        working-directory: apps/readest-app
        run: pnpm test:browser

  coverage_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: verify package manager version
        run: pnpm -w verify:package-manager

      - name: install dependencies and local vendors
        working-directory: apps/readest-app
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm setup-vendors

      - name: run progressive coverage gate
        working-directory: apps/readest-app
        run: pnpm test:coverage -- --run

  build_tauri_app:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: verify package manager version
        run: pnpm -w verify:package-manager

      - name: cache Turbopack dev output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/readest-app/.next/dev/cache
          key: turbo-dev-tauri-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-dev-tauri-${{ runner.os }}-

      - name: install dependencies
        working-directory: apps/readest-app
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm setup-vendors

      - name: setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          rustflags: ''
          cache: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: tauri-cargo-ws
          cache-all-crates: 'true'
          cache-workspace-crates: 'true'

      - name: cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-tauri-${{ runner.os }}

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev xvfb gnome-keyring

      - name: run Tauri integration tests
        working-directory: apps/readest-app
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf "%s" "babelleaf-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            xvfb-run pnpm test:tauri
          '

  security_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: verify package manager version
        run: pnpm -w verify:package-manager

      - name: install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          override: true

      - name: install cargo-audit
        run: cargo install cargo-audit --locked

      - name: audit Windows Rust dependency graph
        run: cargo audit --target-os windows

  windows_installer_smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: verify package manager version
        run: pnpm -w verify:package-manager

      - name: install dependencies
        working-directory: apps/readest-app
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm setup-vendors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          rustflags: ''
          cache: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: windows-installer-smoke
          cache-all-crates: 'true'
          cache-workspace-crates: 'true'

      - name: remove stale NSIS installers
        shell: pwsh
        run: |
          $bundleDirectory = Join-Path $env:GITHUB_WORKSPACE 'target\x86_64-pc-windows-msvc\release\bundle\nsis'
          if (Test-Path -LiteralPath $bundleDirectory) {
            Get-ChildItem -LiteralPath $bundleDirectory -File -Filter '*-setup.exe' |
              Remove-Item -Force
          }

      - name: build unsigned Windows x64 NSIS installer
        working-directory: apps/readest-app
        shell: pwsh
        run: pnpm build-win-x64:unsigned

      - name: install and launch final NSIS artifact
        working-directory: apps/readest-app
        shell: pwsh
        run: pnpm test:windows-installer

      - name: upload installer smoke failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-smoke-logs
          path: apps/readest-app/artifacts/windows-installer-smoke/
          if-no-files-found: ignore
          retention-days: 7

  windows_browser_tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: verify package manager version
        run: pnpm -w verify:package-manager

      - name: install dependencies
        working-directory: apps/readest-app
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm setup-vendors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: run browser-backed application tests
        working-directory: apps/readest-app
        shell: pwsh
        run: pnpm test:browser

  web_e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: verify package manager version
        run: pnpm -w verify:package-manager

      - name: install dependencies and local vendors
        working-directory: apps/readest-app
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm setup-vendors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: build production web output
        working-directory: apps/readest-app
        shell: pwsh
        run: pnpm build-web

      - name: run production web E2E
        working-directory: apps/readest-app
        shell: pwsh
        run: pnpm test:e2e:web

  windows_native_e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: verify package manager version
        run: pnpm -w verify:package-manager

      - name: install dependencies and local vendors
        working-directory: apps/readest-app
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm setup-vendors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          rustflags: ''
          cache: false

      - name: run native WebDriverIO E2E
        working-directory: apps/readest-app
        shell: pwsh
        env:
          # A cache-cold GitHub runner can spend more than five minutes compiling
          # before the WebDriver listener starts. Keep the wait bounded below the
          # job-level timeout while avoiding a false startup failure.
          BABELLEAF_WDIO_TIMEOUT_MS: 600000
          # Hosted runners do not guarantee a functional audio endpoint. This
          # lane still enumerates voices, invokes each available language, and
          # requires a terminal callback; developer/release machines retain the
          # stricter default that requires successful speech completion.
          BABELLEAF_WDIO_REQUIRE_SPEECH_COMPLETION: '0'
        run: pnpm test:e2e

  ci_gate:
    name: required-checks
    if: ${{ always() }}
    needs: [rust_lint, check_app, test_app, coverage_gate, build_tauri_app, security_audit, windows_installer_smoke, windows_browser_tests, web_e2e, windows_native_e2e]
    runs-on: ubuntu-latest
    steps:
      - name: verify required job results
        env:
          RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          CHECK_APP_RESULT: ${{ needs.check_app.result }}
          TEST_APP_RESULT: ${{ needs.test_app.result }}
          COVERAGE_GATE_RESULT: ${{ needs.coverage_gate.result }}
          BUILD_TAURI_RESULT: ${{ needs.build_tauri_app.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security_audit.result }}
          WINDOWS_SMOKE_RESULT: ${{ needs.windows_installer_smoke.result }}
          WINDOWS_BROWSER_RESULT: ${{ needs.windows_browser_tests.result }}
          WEB_E2E_RESULT: ${{ needs.web_e2e.result }}
          WINDOWS_NATIVE_E2E_RESULT: ${{ needs.windows_native_e2e.result }}
        run: |
          # rust_lint is intentionally allowed to skip when no native files changed.
          if [ "$RUST_LINT_RESULT" != "success" ] && [ "$RUST_LINT_RESULT" != "skipped" ]; then
            echo "rust_lint: $RUST_LINT_RESULT"
            exit 1
          fi
          for result in "$CHECK_APP_RESULT" "$TEST_APP_RESULT" "$COVERAGE_GATE_RESULT" "$BUILD_TAURI_RESULT" "$SECURITY_AUDIT_RESULT" "$WINDOWS_SMOKE_RESULT" "$WINDOWS_BROWSER_RESULT" "$WEB_E2E_RESULT" "$WINDOWS_NATIVE_E2E_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "required job result: $result"
              exit 1
            fi
          done
