name: BabelLeaf PR checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      RUSTFLAGS: '-C target-cpu=skylake'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: detect src-tauri changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            tauri:
              - '.github/workflows/pull-request.yml'
              - '.gitmodules'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/readest-app/src-tauri/**'
              - 'packages/swift-rs/**'
              - 'packages/tao'
              - 'packages/tao/**'
              - 'packages/tauri'
              - 'packages/tauri/**'
              - 'packages/tauri-plugins'
              - 'packages/tauri-plugins/plugins/fs/**'

      - name: setup sccache
        if: steps.changes.outputs.tauri == 'true'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: install Rust toolchain
        if: steps.changes.outputs.tauri == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: cache apt packages
        if: steps.changes.outputs.tauri == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-rust-lint-${{ runner.os }}

      - name: install system dependencies
        if: steps.changes.outputs.tauri == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: check Rust formatting
        if: steps.changes.outputs.tauri == 'true'
        working-directory: apps/readest-app/src-tauri
        run: cargo fmt --check

      - name: run Clippy
        if: steps.changes.outputs.tauri == 'true'
        working-directory: apps/readest-app/src-tauri
        run: cargo clippy -p Readest --no-deps -- -D warnings

      - name: run Rust unit tests
        if: steps.changes.outputs.tauri == 'true'
        working-directory: apps/readest-app/src-tauri
        run: cargo test -p Readest --lib

  check_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        working-directory: apps/readest-app
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm setup-vendors

      - name: check formatting
        run: pnpm format:check

      - name: lint application
        working-directory: apps/readest-app
        run: pnpm lint

      - name: build Tauri frontend
        working-directory: apps/readest-app
        run: pnpm build

  test_app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        working-directory: apps/readest-app
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm setup-vendors

      - name: cache Playwright browsers
        if: matrix.shard == 1
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: install Playwright Chromium
        if: matrix.shard == 1
        working-directory: apps/readest-app
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: run application unit tests
        working-directory: apps/readest-app
        run: pnpm test -- --run --maxWorkers=4 --shard=${{ matrix.shard }}/2

      - name: run browser-backed application tests
        if: matrix.shard == 1
        working-directory: apps/readest-app
        run: pnpm test:browser

  build_tauri_app:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: cache Turbopack dev output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/readest-app/.next/dev/cache
          key: turbo-dev-tauri-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-dev-tauri-${{ runner.os }}-

      - name: install dependencies
        working-directory: apps/readest-app
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm setup-vendors

      - name: setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          rustflags: ''
          cache: false

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: tauri-cargo-ws
          cache-all-crates: 'true'
          cache-workspace-crates: 'true'

      - name: cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-tauri-${{ runner.os }}

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev xvfb

      - name: run Tauri integration tests
        working-directory: apps/readest-app
        run: xvfb-run pnpm test:tauri

  windows_installer_smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        working-directory: apps/readest-app
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm setup-vendors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          rustflags: ''
          cache: false

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: windows-installer-smoke
          cache-all-crates: 'true'
          cache-workspace-crates: 'true'

      - name: remove stale NSIS installers
        shell: pwsh
        run: |
          $bundleDirectory = Join-Path $env:GITHUB_WORKSPACE 'target\x86_64-pc-windows-msvc\release\bundle\nsis'
          if (Test-Path -LiteralPath $bundleDirectory) {
            Get-ChildItem -LiteralPath $bundleDirectory -File -Filter '*-setup.exe' |
              Remove-Item -Force
          }

      - name: build unsigned Windows x64 NSIS installer
        working-directory: apps/readest-app
        shell: pwsh
        run: pnpm build-win-x64:unsigned

      - name: install and launch final NSIS artifact
        working-directory: apps/readest-app
        shell: pwsh
        run: pnpm test:windows-installer

      - name: upload installer smoke failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-smoke-logs
          path: apps/readest-app/artifacts/windows-installer-smoke/
          if-no-files-found: ignore
          retention-days: 7

  ci_gate:
    name: required-checks
    if: ${{ always() }}
    needs: [rust_lint, check_app, test_app, build_tauri_app, windows_installer_smoke]
    runs-on: ubuntu-latest
    steps:
      - name: verify required job results
        env:
          RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          CHECK_APP_RESULT: ${{ needs.check_app.result }}
          TEST_APP_RESULT: ${{ needs.test_app.result }}
          BUILD_TAURI_RESULT: ${{ needs.build_tauri_app.result }}
          WINDOWS_SMOKE_RESULT: ${{ needs.windows_installer_smoke.result }}
        run: |
          # rust_lint is intentionally allowed to skip when no native files changed.
          if [ "$RUST_LINT_RESULT" != "success" ] && [ "$RUST_LINT_RESULT" != "skipped" ]; then
            echo "rust_lint: $RUST_LINT_RESULT"
            exit 1
          fi
          for result in "$CHECK_APP_RESULT" "$TEST_APP_RESULT" "$BUILD_TAURI_RESULT" "$WINDOWS_SMOKE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "required job result: $result"
              exit 1
            fi
          done
